# Products the server recognises by name or by container image.
#
# Each entry maps a product to the identifiers the advisory sources need:
#
#   ecosystem + package   registry package, for OSV (exact version matching)
#   otherPackages         further package names for the product, such as a Go
#                         module's /v2 and /v3 paths
#   repo                  upstream GitHub repository, for its security advisories
#   cpe                   NVD's vendor:product name
#   gitlabRepo            gitlab.com project, used only to find the latest release
#   otherCpes             further names NVD files the same product under
#   lifecycle             the product's name in endoflife.date's data, for
#                         end-of-life status and the latest release
#   feeds                 the vendor's own security feeds (Atom or RSS, https)
#   tagPrefix             what the repository puts before the version in its
#                         release tags, when it is not just "v"
#   aliases               other names people and vulnerability lists use
#   images                container image repositories, without registry host or tag
#
# Add a product only with identifiers you have confirmed; a wrong identifier
# makes the server report on the wrong software.

products:
  # ---- AI gateways, model servers and the tools around them

  - name: LiteLLM
    aliases: [litellm, litellm-proxy]
    ecosystem: PyPI
    package: litellm
    repo: BerriAI/litellm
    cpe: litellm:litellm
    images:
      - berriai/litellm
      - berriai/litellm-database
      - berriai/litellm-non_root
      - litellm/litellm

  - name: vLLM
    aliases: [vllm]
    ecosystem: PyPI
    package: vllm
    repo: vllm-project/vllm
    cpe: vllm:vllm
    images:
      - vllm/vllm-openai

  - name: GitLab
    aliases: [gitlab-ee, gitlab-ce]
    cpe: gitlab:gitlab
    gitlabRepo: gitlab-org/gitlab
    feeds:
      - https://about.gitlab.com/security-releases.xml
    lifecycle: gitlab
    images:
      - gitlab/gitlab-ee
      - gitlab/gitlab-ce
      - gitlab-org/build/cng/gitlab-webservice-ee
      - gitlab-org/build/cng/gitlab-webservice-ce
      - gitlab-org/build/cng/gitlab-sidekiq-ee
      - gitlab-org/build/cng/gitlab-sidekiq-ce
      - gitlab-org/build/cng/gitlab-toolbox-ee
      - gitlab-org/build/cng/gitlab-toolbox-ce

  - name: Onyx
    aliases: [onyx-app, danswer]
    repo: onyx-dot-app/onyx
    images:
      - onyxdotapp/onyx-backend
      - onyxdotapp/onyx-web-server
      - onyxdotapp/onyx-model-server
      - danswer/danswer-backend
      - danswer/danswer-web-server

  # ---- Infrastructure
  #
  # Each identifier below was checked when it was added: the repository and
  # its advisories on GitHub, the product name against NVD, the package name
  # against OSV, and the image name against its registry.
  #
  # Products written in Go are also looked up as Go modules, which OSV tracks
  # with exact fixed versions. That matters most where NVD has not yet filed
  # version data for a CVE.

  - name: PostgreSQL
    aliases: [postgres]
    cpe: postgresql:postgresql
    lifecycle: postgresql
    images:
      - postgres
      - cloudnative-pg/postgresql

  - name: Redis
    repo: redis/redis
    cpe: redis:redis
    lifecycle: redis
    images:
      - redis

  - name: Valkey
    repo: valkey-io/valkey
    cpe: lfprojects:valkey
    lifecycle: valkey
    images:
      - valkey/valkey

  # NVD files nginx under two product names, so both are searched.
  - name: nginx
    cpe: f5:nginx
    otherCpes: [f5:nginx_open_source]
    lifecycle: nginx
    images:
      - nginx
      - nginxinc/nginx-unprivileged

  # The repository also releases its Helm chart, so the controller's own
  # tags are picked out by their prefix.
  - name: ingress-nginx
    aliases: [nginx-ingress-controller, ingress-nginx-controller]
    ecosystem: Go
    package: k8s.io/ingress-nginx
    repo: kubernetes/ingress-nginx
    tagPrefix: controller-v
    cpe: kubernetes:ingress-nginx
    images:
      - ingress-nginx/controller

  - name: Kubernetes
    aliases: [k8s, kube-apiserver, kubelet]
    ecosystem: Go
    package: k8s.io/kubernetes
    repo: kubernetes/kubernetes
    cpe: kubernetes:kubernetes
    lifecycle: kubernetes
    images:
      - kube-apiserver
      - kube-controller-manager
      - kube-scheduler
      - kube-proxy

  - name: Traefik
    ecosystem: Go
    package: github.com/traefik/traefik
    otherPackages:
      - github.com/traefik/traefik/v2
      - github.com/traefik/traefik/v3
    repo: traefik/traefik
    cpe: traefik:traefik
    lifecycle: traefik
    images:
      - traefik

  - name: cert-manager
    ecosystem: Go
    package: github.com/cert-manager/cert-manager
    repo: cert-manager/cert-manager
    cpe: cert-manager:cert-manager
    lifecycle: cert-manager
    images:
      - jetstack/cert-manager-controller
      - jetstack/cert-manager-webhook
      - jetstack/cert-manager-cainjector

  - name: Argo CD
    aliases: [argocd]
    ecosystem: Go
    package: github.com/argoproj/argo-cd
    otherPackages:
      - github.com/argoproj/argo-cd/v2
      - github.com/argoproj/argo-cd/v3
    repo: argoproj/argo-cd
    cpe: argoproj:argo_cd
    lifecycle: argo-cd
    images:
      - argoproj/argocd

  - name: Harbor
    ecosystem: Go
    package: github.com/goharbor/harbor
    repo: goharbor/harbor
    cpe: linuxfoundation:harbor
    lifecycle: harbor
    images:
      - goharbor/harbor-core

  # ---- Observability and search

  - name: Grafana
    ecosystem: Go
    package: github.com/grafana/grafana
    repo: grafana/grafana
    cpe: grafana:grafana
    lifecycle: grafana
    images:
      - grafana/grafana
      - grafana/grafana-oss
      - grafana/grafana-enterprise

  - name: Prometheus
    repo: prometheus/prometheus
    cpe: prometheus:prometheus
    lifecycle: prometheus
    images:
      - prom/prometheus
      - prometheus/prometheus

  - name: Elasticsearch
    repo: elastic/elasticsearch
    cpe: elastic:elasticsearch
    lifecycle: elasticsearch
    images:
      - elasticsearch
      - elasticsearch/elasticsearch

  # ---- Identity and secrets

  - name: Keycloak
    repo: keycloak/keycloak
    cpe: redhat:keycloak
    lifecycle: keycloak
    images:
      - keycloak/keycloak

  - name: Vault
    aliases: [hashicorp-vault]
    ecosystem: Go
    package: github.com/hashicorp/vault
    repo: hashicorp/vault
    cpe: hashicorp:vault
    lifecycle: hashicorp-vault
    images:
      - hashicorp/vault

  # ---- AI serving

  - name: Ollama
    ecosystem: Go
    package: github.com/ollama/ollama
    repo: ollama/ollama
    cpe: ollama:ollama
    images:
      - ollama/ollama

  - name: Open WebUI
    aliases: [openwebui]
    ecosystem: PyPI
    package: open-webui
    repo: open-webui/open-webui
    cpe: openwebui:open_webui
    images:
      - open-webui/open-webui
